---
layout: base.njk
title: Blog
---
<h1>Blog</h1>
<p style="color:#63707e;margin:1rem 0 2rem;">Insights on surgical oncology, patient care, and cancer awareness.</p>

{% for post in collections.post %}
<div class="post-card">
  {% if post.data.image %}<img src="{{ post.data.image }}" alt="{{ post.data.title }}">{% endif %}
  <h2><a href="{{ post.url }}">{{ post.data.title }}</a></h2>
  <div class="date">{{ post.date | readableDate }}</div>
  <p>{{ post.data.excerpt }}</p>
</div>
{% endfor %}
